[project]
name = "spesaradar"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2,<3",
    "alembic",
    "httpx",
    "beautifulsoup4",
    "pydantic>=2,<3",
    "pdfplumber>=0.11.10",
]
[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
[tool.ruff]
target-version = "py313"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]
