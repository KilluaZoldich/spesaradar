name: Pubblica SpesaRadar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Check hourly, crawl only when each source's 12-hour TTL permits it.
    - cron: '37 * * * *'
permissions:
  contents: read
concurrency:
  group: spesaradar-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'KilluaZoldich/spesaradar'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.catalog.outputs.publish }}
    env:
      PYTHONPATH: backend
      SPESARADAR_DB: ${{ runner.temp }}/spesaradar/catalog.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Installa dipendenze bloccate
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Ripristina, raccogli e normalizza
        id: catalog
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .private
          status=$(curl --proto '=https' --tlsv1.2 --max-time 30 --max-filesize 10485760 --silent --show-error --output .private/previous.json --write-out '%{http_code}' https://killuazoldich.github.io/spesaradar/catalog.json)
          probe=()
          if [ "$status" = 404 ]; then
            cp site/bootstrap.json .private/previous.json
            probe=(--initial-probe)
          elif [ "$status" != 200 ]; then
            echo "Pubblicazione precedente non raggiungibile: nessuna sostituzione dei dati."
            exit 1
          fi
          python -m alembic upgrade head
          python -m app.pages --restore .private/previous.json --collect "${probe[@]}" --export .private/catalog.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          previous = json.loads(Path('.private/previous.json').read_text())
          current = json.loads(Path('.private/catalog.json').read_text())
          changed = previous.get('source_records') != current.get('source_records')
          publish = changed or os.environ['EVENT_NAME'] != 'schedule'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'publish={str(publish).lower()}\n')
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.catalog.outputs.publish == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verifica e costruisci frontend
        if: steps.catalog.outputs.publish == 'true'
        env:
          VITE_STATIC_CATALOG: 'true'
          VITE_BASE_PATH: /spesaradar/
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web test
          npm --prefix apps/web run build
          cp .private/catalog.json apps/web/dist/catalog.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.catalog.outputs.publish == 'true'
        with:
          path: apps/web/dist
          retention-days: 1
  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
